[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rimkeep"
version = "0.1.0"
description = "Score a crater-rim keep-out from on-rim, shadow setback, slope, and width."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Digital Currensy Inc." }]

[tool.setuptools.packages.find]
where = ["src"]
